<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Win Win Deployment Check</title><style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:20px;line-height:1.5;background:#eef8f6;color:#173d36}main{background:white;padding:24px;border-radius:20px}code{background:#edf3f1;padding:2px 6px;border-radius:6px}button{padding:12px 16px;border:0;border-radius:12px;background:#185f50;color:white;font-weight:700}</style><main><h1>Win Win 4.6.2</h1><p id="result">Prüfe Veröffentlichung …</p><button onclick="location.reload()">Erneut prüfen</button><script>Promise.all([fetch('./version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('./contests.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())]).then(([v,c])=>result.innerHTML=`Veröffentlicht: <strong>${v.version}</strong><br>Verbindlicher Katalog: <strong>${c.contests.length} Einträge</strong><br>Katalogversion: <strong>${c.version}</strong><br>Build: <code>${v.builtAt||v.updated}</code>`).catch(e=>result.textContent='Prüfung fehlgeschlagen: '+e.message)</script></main></html>
